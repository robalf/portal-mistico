<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<meta name="color-scheme" content="dark"><style id="pm-flash">html,body{background:#0A0B18}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B18">
  <meta name="description" content="Consulta la Luna de hoy, rituales lunares, retrógrados y calendario lunar en Brújula Lunar.">
  <title>Brújula Lunar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --noche: #0A0B18;
      --violeta: #2A2560;
      --violeta-claro: #6B5BD6;
      --oro: #C7A24B;
      --oro-claro: #F1D58A;
      --texto: #EEF0FA;
      --secundario: #AEB4D3;
      --rojo: #E46A6A;
      --verde: #6AD6A0;
      --borde: rgba(199, 162, 75, .27);
      --vidrio: transparent;
      font-family: "Nunito", sans-serif;
      color: var(--texto);
      background: var(--noche);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100%; margin: 0; overflow-x: hidden;
      background: radial-gradient(ellipse at 50% -18%, #24204d 0%, #111126 37%, var(--noche) 76%);
      color: var(--texto); font-size: 16px; line-height: 1.55;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    #cielo { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
    #app { position: relative; z-index: 1; }
    .contenedor { width: min(100%, 1100px); margin: 0 auto; padding: 22px 16px 36px; }
    .barra-superior { min-height: 42px; display: flex; align-items: center; justify-content: flex-end; margin-bottom: 6px; }
    .boton-musica, .boton-volver, .flecha-mes {
      min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--borde);
      border-radius: 50%; color: var(--oro-claro); background: rgba(42, 37, 96, .56); cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .boton-musica { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); right: 14px; width: 46px; height: 46px; font-size: 22px; backdrop-filter: blur(10px); }
    .boton-musica[aria-pressed="true"] { color: var(--noche); background: var(--oro-claro); }
    .boton-volver { position: absolute; top: 20px; left: 16px; font-family: "Cormorant Garamond", serif; font-size: 32px; line-height: 1; }
    .boton-musica:hover, .boton-volver:hover, .flecha-mes:hover { background: rgba(107, 91, 214, .48); transform: translateY(-1px); }
    .encabezado { text-align: center; margin: 8px auto 22px; padding: 0 38px; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; }
    h1 { margin-bottom: 0; color: var(--oro-claro); font-size: clamp(38px, 9vw, 54px); font-weight: 600; line-height: 1.03; letter-spacing: .3px; }
    .fecha { margin: 7px 0 0; color: var(--secundario); font-size: 14px; text-transform: capitalize; }
    .saludo { margin: 1px 0 0; color: var(--oro-claro); font-size: 15px; font-weight: 700; }
    .inicio-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .columna-derecha { display: grid; gap: 14px; align-content: start; }
    .tarjeta { min-width: 0; padding: 18px; border: 1px solid var(--borde); border-radius: 20px; background: transparent; box-shadow: none; animation: aparecer .55s ease both; }
    .tarjeta h2 { margin: 0 0 12px; color: var(--oro-claro); font-size: 23px; font-weight: 600; line-height: 1.15; }
    .tarjeta p { color: var(--secundario); }
    @keyframes aparecer { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .tarjeta-luna { text-align: center; }
    .tarjeta-luna h2 { text-align: left; }
    .dibujo-luna { display: block; width: 188px; max-width: 66vw; height: auto; margin: 1px auto 9px; filter: drop-shadow(0 0 16px rgba(199,162,75,.22)); animation: respirar 5.4s ease-in-out infinite; }
    @keyframes respirar { 0%, 100% { filter: drop-shadow(0 0 12px rgba(199,162,75,.18)); } 50% { filter: drop-shadow(0 0 24px rgba(199,162,75,.42)); } }
    .nombre-fase { color: var(--texto); font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.1; }
    .dato-destacado { margin: 4px 0 9px; color: var(--oro-claro); font-size: 15px; }
    .mini-contadores { display: grid; grid-template-columns: 1fr; gap: 7px; margin: 13px 0; text-align: left; }
    .contador { padding: 9px 11px; border: 1px solid rgba(199,162,75,.17); border-radius: 12px; background: rgba(10,11,24,.32); color: var(--secundario); font-size: 13px; }
    .contador strong { display: block; color: var(--texto); font-size: 14px; }
    .boton-texto, .boton-primario { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border: 1px solid rgba(199,162,75,.38); border-radius: 12px; background: rgba(107,91,214,.2); color: var(--oro-claro); text-decoration: none; font-weight: 800; cursor: pointer; transition: background .2s, transform .2s; }
    .boton-texto { width: 100%; margin-top: 11px; }
    .boton-primario { background: linear-gradient(135deg, var(--oro), var(--oro-claro)); color: #171322; border-color: transparent; }
    .boton-texto:hover, .boton-primario:hover { transform: translateY(-1px); background-color: rgba(107,91,214,.38); }
    .ritual-titulo { margin: 0 0 3px; color: var(--texto); font-size: 17px; font-weight: 800; }
    .ritual-intro { margin: 0; color: var(--secundario); }
    .retro-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.07); color: var(--texto); }
    .estado { display: inline-flex; align-items: center; gap: 8px; }
    .punto { display: inline-block; width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 9px currentColor; }
    .punto.rojo { color: var(--rojo); background: var(--rojo); }
    .punto.verde { color: var(--verde); background: var(--verde); }
    .estado-texto { color: var(--secundario); font-size: 13px; }
    .semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .dia-mini { min-width: 0; padding: 7px 2px; border: 1px solid rgba(199,162,75,.12); border-radius: 11px; background: rgba(10,11,24,.28); text-align: center; }
    .dia-mini.hoy { border-color: var(--oro); }
    .dia-mini span { display: block; color: var(--secundario); font-size: 11px; }
    .dia-mini b { display: block; color: var(--texto); font-size: 12px; }
    .dia-mini i { display: block; font-size: 16px; font-style: normal; }
    .accesos { margin-top: 18px; }
    .accesos > h2, .racha h2 { margin: 0 0 12px; color: var(--oro-claro); font-family: "Cormorant Garamond", Georgia, serif; font-size: 27px; font-weight: 600; }
    .acceso-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .acceso { min-height: 76px; display: flex; align-items: center; gap: 13px; padding: 14px; border: 1px solid var(--borde); border-radius: 17px; background: var(--vidrio); color: var(--texto); text-decoration: none; transition: transform .2s, border-color .2s; }
    .acceso:hover { transform: translateY(-2px); border-color: rgba(241,213,138,.7); }
    .acceso-icono { font-size: 27px; }
    .acceso strong { display: block; color: var(--oro-claro); font-size: 16px; }
    .acceso small { display: block; color: var(--secundario); font-size: 13px; line-height: 1.35; }
    .racha { position: relative; overflow: hidden; margin-top: 16px; padding: 17px; border: 1px solid rgba(199,162,75,.22); border-radius: 18px; background: transparent; text-align: center; }
    .racha p { margin: 0; color: var(--texto); font-weight: 700; }
    .felicitacion { margin-top: 6px !important; color: var(--oro-claro) !important; animation: destello 1.7s ease-in-out infinite alternate; }
    @keyframes destello { to { text-shadow: 0 0 12px rgba(241,213,138,.8); transform: scale(1.02); } }
    .estrellas-logro { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .estrellas-logro span { position: absolute; color: var(--oro-claro); animation: subir-estrella 2.1s ease-out infinite; opacity: 0; }
    .estrellas-logro span:nth-child(1) { left: 15%; animation-delay: 0s; }
    .estrellas-logro span:nth-child(2) { left: 48%; animation-delay: .55s; }
    .estrellas-logro span:nth-child(3) { left: 80%; animation-delay: 1.05s; }
    @keyframes subir-estrella { 0% { opacity: 0; transform: translateY(28px) scale(.5); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-24px) scale(1.15); } }
    footer { margin: 24px auto 0; color: var(--secundario); text-align: center; font-size: 13px; }
    .pantalla-interna { position: relative; padding-top: 6px; }
    .encabezado-interno { margin: 8px 42px 20px; text-align: center; }
    .encabezado-interno h1 { font-size: clamp(34px, 8vw, 46px); }
    .detalle { max-width: 760px; margin: 0 auto; }
    .detalle .tarjeta { margin-bottom: 14px; }
    .detalle-luna { text-align: center; }
    .detalle-luna .dibujo-luna { width: 250px; }
    .detalle-luna .nombre-fase { font-size: 36px; }
    .texto-fase { max-width: 610px; margin: 10px auto 0; color: var(--secundario); }
    .energia { margin: 9px 0 0; padding: 13px; border-radius: 13px; background: rgba(10,11,24,.32); color: var(--texto) !important; }
    .filas-datos { margin: 12px auto; max-width: 500px; }
    .fila-dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; }
    .fila-dato span:first-child { color: var(--secundario); }
    .fila-dato span:last-child { color: var(--texto); text-align: right; }
    .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 16px; }
    .acciones button { min-height: 46px; }
    .grupo-rituales { display: grid; gap: 12px; }
    .ritual-detalle h2 { margin-bottom: 3px; }
    .ritual-detalle .intencion { color: var(--oro-claro); }
    .ritual-detalle ol { margin: 8px 0 10px; padding-left: 23px; color: var(--texto); }
    .ritual-detalle li { padding: 3px 0; }
    .afirmacion { margin: 12px 0 0; color: var(--oro-claro) !important; font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; font-style: italic; }
    .nota-seguridad { margin: 12px 4px 0; color: var(--secundario); font-size: 13px; }
    .retro-detalle-grid { display: grid; gap: 12px; }
    .estado-grande { display: flex; align-items: center; gap: 10px; margin: 0 0 7px; color: var(--texto); font-size: 19px; font-weight: 800; }
    .estado-grande .punto { width: 12px; height: 12px; flex-basis: 12px; }
    .barra-progreso { height: 8px; overflow: hidden; margin-top: 12px; border-radius: 99px; background: rgba(10,11,24,.65); }
    .barra-progreso span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--rojo), #f1a777); }
    .aviso-doble { padding: 14px; border: 1px solid rgba(241,213,138,.5); border-radius: 15px; background: rgba(199,162,75,.1); color: var(--oro-claro); }
    .mes-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .mes-cabecera h2 { margin: 0; color: var(--oro-claro); font-size: 27px; text-align: center; text-transform: capitalize; }
    .flecha-mes { width: 44px; height: 44px; font-family: "Cormorant Garamond", serif; font-size: 30px; }
    .calendario-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .cab-dia { padding: 4px 0; color: var(--secundario); font-size: 12px; font-weight: 800; text-align: center; }
    .celda-dia { position: relative; min-width: 0; min-height: 66px; padding: 4px 2px; border: 1px solid rgba(199,162,75,.11); border-radius: 11px; background: rgba(10,11,24,.36); color: var(--texto); cursor: pointer; text-align: center; }
    .celda-dia:hover { border-color: rgba(241,213,138,.7); background: rgba(107,91,214,.3); }
    .celda-dia.hoy { border: 2px solid var(--oro); }
    .celda-dia.otro-mes { visibility: hidden; pointer-events: none; }
    .celda-dia .numero-dia { display: block; font-size: 12px; line-height: 1.2; }
    .celda-dia .icono-fase { display: block; margin-top: 3px; font-size: 19px; line-height: 1.1; }
    .celda-dia .marca-roja { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--rojo); }
    .leyenda-cal { display: flex; flex-wrap: wrap; gap: 7px 13px; margin: 12px 0 0; color: var(--secundario); font-size: 12px; }
    .leyenda-cal span { white-space: nowrap; }
    .modal-fondo { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(5,6,15,.78); backdrop-filter: blur(7px); }
    .modal-fondo[hidden] { display: none; }
    .modal-caja { position: relative; width: min(100%, 440px); max-height: min(80vh, 650px); overflow-y: auto; padding: 22px; border: 1px solid rgba(199,162,75,.48); border-radius: 20px; background: #171632; box-shadow: 0 20px 70px rgba(0,0,0,.5); }
    .modal-caja h2 { color: var(--oro-claro); font-size: 27px; }
    .cerrar-modal { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 1px solid var(--borde); border-radius: 50%; background: rgba(42,37,96,.75); color: var(--oro-claro); cursor: pointer; font-size: 23px; }
    .toast { position: fixed; z-index: 12; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 12px); padding: 11px 18px; border: 1px solid var(--oro); border-radius: 999px; background: #191733; color: var(--oro-claro); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .error-fecha { color: var(--rojo) !important; }
    @media (min-width: 560px) {
      .contenedor { padding-right: 24px; padding-left: 24px; }
      .mini-contadores { grid-template-columns: 1fr 1fr; }
      .acceso-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .acceso { align-items: flex-start; flex-direction: column; gap: 5px; }
      .retro-detalle-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1000px) {
      .contenedor { padding: 26px 24px 44px; }
      .inicio-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 18px; }
      .columna-derecha { gap: 18px; }
      .tarjeta { padding: 22px; }
      .tarjeta h2 { font-size: 26px; }
      .tarjeta, .acceso, .racha { font-size: 1.15em; }
      .dibujo-luna { width: 230px; }
      .tarjeta-luna .nombre-fase { font-size: 36px; }
      .accesos { margin-top: 23px; }
      .acceso-grid { gap: 14px; }
      .semana { gap: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="cielo" aria-hidden="true"></canvas>
  <button id="boton-musica" class="boton-musica" type="button" aria-label="Activar música" aria-pressed="false">♪</button>
  <main id="app" class="contenedor" aria-live="polite"></main>
  <div id="modal" class="modal-fondo" hidden>
    <section class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <button id="cerrar-modal" class="cerrar-modal" type="button" aria-label="Cerrar">×</button>
      <div id="modal-contenido"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.js?v=pm4"></script>
</body>
</html>
