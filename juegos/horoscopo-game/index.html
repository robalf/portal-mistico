<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
<meta name="color-scheme" content="dark"><style id="pm-flash">html,body{background:#0A0B18}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080716" />
    <title>Oráculo Celeste — Horóscopos originales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!--
      Rosebud defaults disable accidental selection, context menus, tap highlights,
      and native dragging during gameplay while preserving text editing. Most games
      need no customization.
    -->
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      :root { --gold:#e7c77d; --gold2:#a98542; --ink:#f7f1e3; --muted:#b6adc9; --panel:rgba(12,10,31,.80); --line:rgba(231,199,125,.20); }
      * { box-sizing: border-box; }
      html, body, #game-container { width:100%; min-height:100%; margin:0; }
      body { overflow:hidden; color:var(--ink); font-family:Montserrat,system-ui,sans-serif; background:#070611; }
      button { font:inherit; }
      #game-container { position:relative; height:100vh; overflow:hidden; background:linear-gradient(90deg,rgba(4,4,14,.35),rgba(8,6,24,.72)),url('assets/cielo-astral-nocturno.webp') center/cover no-repeat; }
      #game-container::after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 55% 50%,transparent 0 35%,rgba(3,2,12,.42) 100%); }
      .stars { position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
      .star { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff6cf; box-shadow:0 0 8px #d4b968; animation:twinkle var(--d) ease-in-out infinite alternate; opacity:.25; }
      @keyframes twinkle { to { opacity:.95; transform:scale(1.8); } }
      .app-label { position:absolute; top:24px; left:50%; transform:translateX(-50%); z-index:3; color:var(--gold); font:600 clamp(30px,3.2vw,48px)/1 'Cormorant Garamond',serif; letter-spacing:.14em; text-align:center; white-space:nowrap; text-shadow:0 0 18px rgba(231,199,125,.24); }
      .app-label::before, .app-label::after { content:""; display:inline-block; width:clamp(34px,5vw,76px); height:1px; margin:0 14px 13px; background:linear-gradient(90deg,transparent,var(--gold)); opacity:.7; }
      .app-label::after { background:linear-gradient(90deg,var(--gold),transparent); }
      .app { position:relative; z-index:2; height:100%; display:grid; grid-template-columns:minmax(360px, 420px) 1fr; gap:clamp(22px,3vw,54px); padding:clamp(82px,10vh,108px) clamp(26px,4vw,76px) clamp(22px,3.4vh,42px); max-width:1920px; margin:auto; }
      .sidebar { min-height:0; display:flex; flex-direction:column; }
      .brand { display:flex; align-items:center; gap:13px; margin-bottom:18px; }
      .brand-mark { width:42px; height:42px; border:1px solid var(--gold2); border-radius:50%; display:grid; place-items:center; color:var(--gold); font-size:23px; box-shadow:inset 0 0 20px rgba(173,128,54,.17); }
      .eyebrow { color:var(--gold); letter-spacing:.22em; text-transform:uppercase; font-size:10px; font-weight:600; }
      .brand h1 { margin:2px 0 0; font:600 26px/1 'Cormorant Garamond',serif; letter-spacing:.04em; }
      .choose-title { margin:6px 0 4px; font:600 clamp(30px,2vw,39px)/1.05 'Cormorant Garamond',serif; }
      .choose-copy { margin:0 0 17px; color:var(--muted); font-size:12px; line-height:1.6; }
      .sign-grid { min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:3px 4px 6px 1px; scrollbar-width:thin; scrollbar-color:var(--gold2) transparent; }
      .sign-card { position:relative; min-height:92px; padding:10px 5px 9px; border:1px solid rgba(208,181,124,.14); border-radius:12px; color:var(--muted); background:linear-gradient(145deg,rgba(29,22,61,.70),rgba(9,8,26,.82)); cursor:pointer; transition:.25s ease; }
      .sign-card:hover { transform:translateY(-2px); color:var(--ink); border-color:rgba(231,199,125,.45); background:rgba(44,31,77,.78); }
      .sign-card.active { color:var(--ink); border-color:var(--gold); background:linear-gradient(145deg,rgba(104,68,135,.55),rgba(26,17,52,.92)); box-shadow:0 0 22px rgba(165,112,212,.16),inset 0 0 18px rgba(231,199,125,.06); }
      .sign-card.active::after { content:""; position:absolute; width:4px; height:4px; border-radius:50%; background:var(--gold); top:8px; right:9px; box-shadow:0 0 8px var(--gold); }
      .glyph { display:block; color:var(--gold); font:400 30px/1.15 Georgia,serif; text-shadow:0 0 14px rgba(232,199,125,.2); }
      .sign-name { display:block; font-size:11px; margin-top:5px; letter-spacing:.02em; }
      .main { min-width:0; display:flex; flex-direction:column; justify-content:center; padding-top:16px; }
      .topbar { display:flex; justify-content:flex-end; gap:9px; margin-bottom:clamp(20px,4vh,42px); }
      .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); color:var(--gold); background:rgba(10,8,27,.55); cursor:pointer; transition:.2s; }
      .icon-btn:hover { border-color:var(--gold); background:rgba(46,31,75,.7); }
      .reading { width:min(100%,1040px); align-self:center; }
      .selection-label { display:flex; align-items:center; gap:11px; color:var(--gold); font-size:10px; letter-spacing:.23em; text-transform:uppercase; }
      .selection-label::before { content:""; width:38px; height:1px; background:var(--gold2); }
      .hero-line { display:flex; align-items:flex-end; gap:24px; margin:13px 0 23px; }
      .hero-glyph { flex:0 0 auto; width:88px; height:88px; display:grid; place-items:center; border:1px solid rgba(231,199,125,.50); border-radius:50%; color:var(--gold); font:50px Georgia,serif; box-shadow:inset 0 0 25px rgba(183,124,75,.12),0 0 40px rgba(97,56,138,.2); }
      .title-wrap h2 { margin:0; font:600 clamp(51px,5vw,76px)/.82 'Cormorant Garamond',serif; letter-spacing:-.02em; }
      .meta { margin-top:13px; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
      .tabs { display:flex; gap:6px; padding-bottom:11px; overflow-x:auto; border-bottom:1px solid var(--line); }
      .tab { white-space:nowrap; padding:10px 15px; border:0; border-radius:20px; color:#aaa1bd; background:transparent; cursor:pointer; font-size:11px; letter-spacing:.04em; transition:.2s; }
      .tab:hover { color:var(--ink); background:rgba(255,255,255,.04); }
      .tab.active { color:#1a1221; background:linear-gradient(100deg,#caa55d,#f0d99a); box-shadow:0 6px 20px rgba(201,165,93,.16); font-weight:600; }
      .oracle { margin-top:25px; min-height:290px; padding:clamp(22px,3vw,38px); border:1px solid var(--line); border-radius:18px; background:linear-gradient(135deg,rgba(20,15,45,.86),rgba(8,7,23,.80)); box-shadow:0 22px 70px rgba(0,0,0,.26); backdrop-filter:blur(13px); }
      .oracle.reveal { animation:reveal .58s cubic-bezier(.2,.8,.2,1); }
      @keyframes reveal { from { opacity:0; transform:translateY(10px); filter:blur(3px); } to { opacity:1; transform:none; filter:none; } }
      .oracle-head { display:flex; justify-content:space-between; align-items:center; gap:20px; }
      .oracle h3 { margin:0; color:var(--gold); font:600 24px 'Cormorant Garamond',serif; }
      .date { color:#8f869f; font-size:10px; text-transform:uppercase; letter-spacing:.12em; }
      .prediction { margin:18px 0 23px; max-width:910px; color:#e7e0ec; font:500 clamp(18px,1.45vw,22px)/1.62 'Cormorant Garamond',serif; }
      .insights { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      .insight { padding:12px 14px; border-left:1px solid var(--gold2); background:rgba(255,255,255,.025); }
      .insight b { display:block; margin-bottom:5px; color:var(--gold); font-size:9px; letter-spacing:.15em; text-transform:uppercase; }
      .insight span { color:#c7bfd1; font-size:11px; line-height:1.4; }
      .actions { display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
      .regenerate { border:0; color:var(--gold); background:transparent; padding:8px 0; cursor:pointer; font-size:10px; letter-spacing:.13em; text-transform:uppercase; }
      .regenerate:hover { color:#fff0bd; }
      .original { color:#787083; font-size:9px; letter-spacing:.08em; }
      @media (max-height:760px) { .app{padding-top:38px;padding-bottom:18px}.sign-card{min-height:74px}.glyph{font-size:25px}.oracle{min-height:240px;margin-top:17px;padding:22px}.hero-glyph{width:70px;height:70px;font-size:40px}.hero-line{margin:8px 0 15px}.topbar{margin-bottom:12px}.brand{margin-bottom:8px}.choose-title{font-size:28px}.choose-copy{margin-bottom:8px}.title-wrap h2{font-size:52px} }
      @media (max-width:900px) { body{overflow:auto} #game-container{height:auto;min-height:100vh;overflow:visible}.app{grid-template-columns:1fr;height:auto;padding:58px 25px 25px}.sign-grid{grid-template-columns:repeat(6,1fr);overflow:visible}.main{padding:0}.topbar{position:absolute;right:24px;top:23px}.reading{padding-bottom:30px}.hero-line{margin-top:10px}.oracle{min-height:0}.choose-copy{max-width:600px} }
      @media (max-width:620px) { .sign-grid{grid-template-columns:repeat(4,1fr)}.insights{grid-template-columns:1fr}.hero-glyph{width:66px;height:66px;font-size:38px}.title-wrap h2{font-size:44px}.tabs{padding-bottom:8px}.oracle-head{align-items:flex-start;flex-direction:column;gap:5px}.original{display:none} }
    </style>
  <style id="pm-fondo-unico">
/* Fondo único oscuro, igual que Brújula Lunar */
html,body{background:#0A0B18!important}
#game-container,#game-container.app,.app{background:radial-gradient(ellipse at 50% -18%,#24204d 0%,#111126 37%,#0A0B18 76%)!important}
#game-container::before,#game-container::after,.app::before,.app::after{background-image:none!important}
#game-container>img.bg,#game-container .bg-image,.bg-image{display:none!important}
</style>
</head>
  <body>
</div>
    <div id="game-container" aria-label="Aplicación de horóscopos"></div>
    <script type="module" src="./main.js?v=pm9"></script>
  </body>
</html>
