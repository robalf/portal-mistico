<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
<meta name="color-scheme" content="dark"><style id="pm-flash">html,body{background:#09071b}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09071b" />
    <title>Numerología · Tu mapa interior</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Rosebud defaults disable accidental selection, context menus, tap highlights,
      and native dragging during gameplay while preserving text editing. Most games
      need no customization.
    -->
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      :root{--night:#09071b;--ink:#100d27;--violet:#6d4cc7;--lavender:#c9b8ff;--gold:#e8c875;--gold2:#fff0b0;--text:#f4efff;--muted:#b7afd0;--panel:rgba(18,14,43,.82);--line:rgba(232,200,117,.28)}
      *{box-sizing:border-box}
      html,body,#game-container{width:100%;height:100%;margin:0}
      html{background:var(--night)}
      body{overflow:hidden;background:#080616;color:var(--text);font-family:Manrope,system-ui,sans-serif;touch-action:pan-y}
      button,input,select{font:inherit}
      button{color:inherit}
      #game-container{position:relative;overflow:hidden;background:linear-gradient(rgba(6,5,20,.22),rgba(6,5,20,.72)),url('assets/fondo-cosmos-numerologia.webp') center/cover no-repeat}
      #game-container::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 25%,rgba(113,74,198,.15),transparent 40%),linear-gradient(180deg,rgba(4,3,15,.05),rgba(4,3,15,.55))}
      .app{position:relative;height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:max(5vh,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) max(4vh,env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left))}
      .topbar{height:50px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;z-index:3}
      .brand{font-family:Cinzel,serif;font-size:15px;letter-spacing:.14em;color:var(--gold2);display:flex;gap:9px;align-items:center}
      .brand-mark{font-size:19px;filter:drop-shadow(0 0 8px rgba(232,200,117,.7))}
      .icon-btn,.back-btn{border:1px solid var(--line);background:rgba(12,9,32,.72);min-width:44px;height:44px;border-radius:22px;display:grid;place-items:center;cursor:pointer;transition:.2s transform,.2s background}
      .icon-btn:active,.back-btn:active,.primary:active,.card:active{transform:scale(.96)}
      .screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 2px 30px;scrollbar-width:none;animation:arrive .42s ease both}
      .screen::-webkit-scrollbar{display:none}
      @keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .hero{text-align:center;padding:2px 12px 20px}
      .emblem{width:102px;height:102px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(232,200,117,.3));animation:float 5s ease-in-out infinite}
      @keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}
      h1,h2,h3{font-family:Cinzel,serif;margin:0}
      h1{font-size:clamp(26px,7vw,40px);font-weight:600;letter-spacing:.05em;background:linear-gradient(90deg,#fff2b8,#d2b25f,#fff6d7);-webkit-background-clip:text;color:transparent}
      .eyebrow{color:var(--lavender);font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin:8px 0}
      .hero p{font-size:13px;line-height:1.6;color:var(--muted);max-width:460px;margin:9px auto 0}
      .grid{display:grid;gap:12px;padding-bottom:12px}
      .card{position:relative;width:100%;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(28,21,63,.92),rgba(13,10,35,.83));padding:17px 16px;text-align:left;display:grid;grid-template-columns:52px 1fr 24px;gap:12px;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.04);cursor:pointer;overflow:hidden;transition:.22s transform,.22s border-color}
      .card:hover{border-color:rgba(232,200,117,.55);transform:translateY(-2px)}
      .card::after{content:"";position:absolute;width:90px;height:90px;right:-35px;top:-45px;border:1px solid rgba(232,200,117,.09);border-radius:50%}
      .sigil{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(232,200,117,.35);color:var(--gold2);font-family:Cinzel;font-size:21px;background:radial-gradient(circle,rgba(111,76,199,.28),rgba(0,0,0,.1));box-shadow:0 0 18px rgba(108,75,190,.2)}
      .card h3{font-size:14px;color:#f9f2dd;margin-bottom:5px;letter-spacing:.02em}
      .card p{font-size:11px;line-height:1.45;color:var(--muted);margin:0}
      .arrow{color:var(--gold);font-size:22px}
      .section-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:3px 0 20px;text-align:center}
      .section-head h2{font-size:clamp(18px,5vw,25px);color:var(--gold2);line-height:1.2}
      .section-head .symbol{color:var(--lavender);font-size:20px}
      .panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(12px);padding:21px 18px;box-shadow:0 18px 45px rgba(0,0,0,.3)}
      .intro{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 20px;text-align:center}
      .field{margin:0 0 16px}
      label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:0 0 8px 3px}
      input,select{width:100%;height:54px;border-radius:14px;border:1px solid rgba(201,184,255,.24);background:rgba(6,4,21,.68);color:var(--text);padding:0 15px;outline:none;font-size:16px;transition:.2s;border-color,.2s box-shadow;color-scheme:dark}
      input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,200,117,.1)}
      input::placeholder{color:#79718f}
      .primary{width:100%;min-height:54px;border:1px solid #f6db8f;border-radius:15px;background:linear-gradient(135deg,#c69a3c,#f0d98a 52%,#b6872f);color:#21172c;font-weight:800;letter-spacing:.04em;cursor:pointer;box-shadow:0 8px 24px rgba(211,169,73,.18);transition:.2s transform,.2s filter}
      .primary:hover{filter:brightness(1.07)}
      .error{min-height:18px;margin:10px 2px 0;color:#f2a9cc;font-size:12px;text-align:center}
      .result{margin-top:18px;border-top:1px solid var(--line);padding-top:20px;text-align:center;animation:reveal .55s cubic-bezier(.2,.8,.2,1) both}
      @keyframes reveal{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
      .result-orbit{width:118px;height:118px;margin:0 auto 13px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(121,81,204,.42),rgba(14,10,39,.85) 65%);border:1px solid rgba(239,210,129,.62);box-shadow:0 0 0 7px rgba(232,200,117,.04),0 0 30px rgba(121,81,204,.32)}
      .result-orbit::before,.result-orbit::after{content:"✦";position:absolute;color:var(--gold);font-size:10px}.result-orbit::before{top:8px;left:14px}.result-orbit::after{bottom:10px;right:12px}
      .big-number{font-family:Cinzel,serif;font-size:51px;line-height:1;color:var(--gold2);text-shadow:0 0 18px rgba(232,200,117,.42)}
      .percent{font-size:38px}
      .result-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--lavender)}
      .result h3{font-size:19px;margin:8px 0;color:#fff2c8}
      .result p{font-size:13px;line-height:1.68;color:#d1c9e6;margin:8px 0}
      .lucky-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
      .lucky{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#efda96,#b8842d);color:#24162e;font-family:Cinzel;font-weight:700;box-shadow:0 4px 16px rgba(232,200,117,.22)}
      .footnote{text-align:center;color:#8e86a6;font-size:10px;margin:16px 10px;line-height:1.5}
      @media(min-width:650px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}.app{padding-left:30px;padding-right:30px}.panel{padding:28px 30px}}
      @media(max-height:700px){.emblem{width:74px;height:74px}.hero{padding-bottom:12px}.hero p{display:none}.card{padding-top:13px;padding-bottom:13px}.topbar{height:42px}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    
/* PM-DESKTOP */
@media (min-width:1000px) and (min-height:560px){
  .app{zoom:1.3;max-width:860px;}
  .hero p{max-width:560px;}
}
</style>
  </head>
  <body>
</div>
    <div id="game-container"></div>
    <script type="module" src="./main.js?v=pm6"></script>
  </body>
</html>
