<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100727" />
    <title>Oráculo de los Signos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      :root{--gold:#e9c77b;--pale:#fff7df;--lav:#cbb5ff;--ink:#0b0820;--card:rgba(26,14,55,.78);--line:rgba(233,199,123,.3)}
      *{box-sizing:border-box} html,body,#game-container{width:100%;height:100%;margin:0;background:#0b0820;color:var(--pale)}
      body{font-family:Nunito,system-ui,sans-serif;overflow:hidden;touch-action:pan-y}
      button,input{font:inherit} button{color:inherit}
      #game-container{position:relative;overflow:hidden;background:linear-gradient(rgba(8,7,31,.3),rgba(20,4,35,.54)),url('assets/cielo-zodiacal-sin-luna.webp') center/cover}
      #game-container:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 20%,transparent 0 25%,rgba(7,3,20,.48) 100%)}
      .app{position:relative;z-index:1;height:100%;max-width:780px;margin:auto;display:flex;flex-direction:column;padding:max(5vh,24px) max(3vw,14px) max(4vh,18px)}
      header{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 10px}
      .brand{display:flex;align-items:center;gap:10px}.brand img{width:47px;height:47px;object-fit:contain;filter:drop-shadow(0 0 12px #b986ff80)}
      .brand strong{font-family:"Cormorant Garamond";font-size:20px;letter-spacing:.04em;color:var(--gold)}
      .icon-btn{width:46px;height:46px;border:1px solid var(--line);background:rgba(15,9,40,.7);border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer}
      .back{visibility:hidden}.back.show{visibility:visible}.spacer{width:46px}
      main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 3px 28px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
      .screen{display:none;animation:rise .38s ease}.screen.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .hero{text-align:center;margin:2px auto 23px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--lav);font-weight:700}.hero h1,.screen-title{font-family:"Cormorant Garamond";font-weight:600;margin:5px 0;color:var(--pale);line-height:1.03}
      .hero h1{font-size:clamp(38px,11vw,58px)}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{max-width:390px;margin:9px auto;color:#ded5ee;font-size:14px;line-height:1.55}
      .section-head{text-align:center;margin:3px 0 19px}.screen-title{font-size:clamp(31px,9vw,46px)}.section-head p{margin:6px auto;color:#d9cee9;font-size:13px;max-width:430px}
      .topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.topic{min-height:132px;padding:16px 13px;border:1px solid var(--line);border-radius:20px;text-align:left;background:linear-gradient(145deg,rgba(60,29,91,.78),rgba(17,10,44,.84));box-shadow:inset 0 1px #fff1,0 9px 22px #06031655;cursor:pointer;transition:.2s}.topic:active,.zodiac:active{transform:scale(.97);background-color:#523078}.topic .num{display:flex;align-items:center;justify-content:space-between;font-family:"Cormorant Garamond";color:var(--gold);font-size:13px}.topic .glyph{font-size:24px}.topic h2{font-family:"Cormorant Garamond";font-size:21px;line-height:1.08;margin:12px 0 0;font-weight:600}.topic p{color:#bfb1d4;font-size:11px;margin:7px 0 0}
      .zodiacs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.zodiac{min-height:99px;border:1px solid var(--line);border-radius:17px;background:rgba(27,15,59,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 1px #fff1}.zodiac b{font-family:"Cormorant Garamond";font-size:17px}.zodiac .symbol{font-size:29px;color:var(--gold);line-height:1.15}.zodiac small{font-size:9px;color:#bfb1d4}
      .result-card{position:relative;overflow:hidden;text-align:center;border:1px solid #e9c77b66;border-radius:28px;background:linear-gradient(160deg,rgba(54,27,86,.94),rgba(15,9,42,.94));padding:25px 22px 22px;box-shadow:0 18px 45px #050216aa,inset 0 1px #fff2}.result-card:before{content:"✦";position:absolute;right:17px;top:12px;color:#e9c77b66;font-size:30px}.big-symbol{width:82px;height:82px;margin:auto;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:42px;background:#110a2a;box-shadow:0 0 30px #8a55cc55}.result-card h2{font-family:"Cormorant Garamond";font-size:39px;margin:11px 0 1px;color:var(--gold)}.result-card .theme-label{color:var(--lav);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.reading{font-family:"Cormorant Garamond";font-size:20px;line-height:1.48;margin:19px auto 12px;max-width:540px}.mantra{border-top:1px solid var(--line);padding-top:14px;color:#e7d8ff;font-size:13px;font-style:italic}.actions{display:flex;gap:10px;margin-top:15px}.primary,.secondary{min-height:49px;border-radius:15px;padding:0 17px;cursor:pointer;font-weight:700}.primary{flex:1;border:0;background:linear-gradient(135deg,#f1d28b,#bd8940);color:#26132f}.secondary{border:1px solid var(--line);background:#1c103c}
      .year-box{max-width:460px;margin:10px auto;border:1px solid var(--line);border-radius:25px;padding:25px 20px;background:rgba(25,13,55,.88);text-align:center}.year-box label{display:block;font-family:"Cormorant Garamond";font-size:22px;margin-bottom:14px}.year-row{display:flex;gap:9px}.year-row input{min-width:0;flex:1;height:54px;border:1px solid #e9c77b66;border-radius:14px;background:#0d0925;color:white;text-align:center;font-size:20px;outline:none}.year-row input:focus{box-shadow:0 0 0 3px #b98cff33}.hint{font-size:11px;color:#b9aacd;margin-top:12px}.error{color:#ffd1ca;min-height:20px;margin:8px 0 0;font-size:12px}
      .toast{position:absolute;z-index:3;left:50%;bottom:7%;transform:translate(-50%,20px);opacity:0;background:#f1d28b;color:#25132d;border-radius:20px;padding:10px 18px;font-size:12px;font-weight:700;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
      @media(min-width:600px){.topics{grid-template-columns:repeat(4,1fr)}.zodiacs{grid-template-columns:repeat(4,1fr)}.topic{min-height:155px}.app{padding-left:22px;padding-right:22px}}
      @media(max-height:680px){.app{padding-top:18px}.brand img{width:38px;height:38px}.hero{margin-bottom:14px}.hero h1{font-size:38px}.topic{min-height:115px}.topic p{display:none}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    
/* PM-DESKTOP */
@media (min-width:1000px) and (min-height:560px){
  .app{zoom:1.25;max-width:900px;padding-top:max(9vh,40px);}
  .hero p{max-width:480px;}
}
</style>
  </head>
  <body>
</div>
    <div id="game-container"></div>
    <script type="module" src="./main.js?v=pm6"></script>
  </body>
</html>
